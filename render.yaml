# Render Blueprint for Hostera: the Angular SPA as a static site and the
# demonstration mock API (JSON Server) it reads from until the Spring Boot RESTful API is deployed.
services:
  - type: web
    name: team-coworkers-hostera-web
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist/browser
    envVars:
      - key: NODE_VERSION
        value: "22"
    # Every client-side route, such as /bookings or /sign-up, is served by the Angular router.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: team-coworkers-hostera-api
    runtime: node
    plan: free
    branch: main
    # JSON Server is a development dependency, so it must be installed explicitly.
    buildCommand: npm ci --include=dev
    startCommand: npm run server:start -- --host 0.0.0.0 --port $PORT
    healthCheckPath: /properties
