<mat-sidenav-container class="h-screen" [hasBackdrop]="layout.compact()">
  <mat-sidenav
    id="app-sidebar"
    [mode]="layout.compact() ? 'over' : 'side'"
    [opened]="!layout.compact() || layout.sidebarOpen()"
    [class.collapsed]="collapsed()"
    [class.expanded]="!layout.compact() && layout.sidebarOpen()"
    [class.compact]="layout.compact()"
    (closedStart)="layout.sidebarOpen.set(false)"
    (mouseenter)="hover(true)"
    (mouseleave)="hover(false)"
  >
    <div class="flex flex-column h-full">
      <div class="flex align-items-center justify-content-center h-4rem px-2">
        <a routerLink="/" class="flex">
          <app-brand-logo />
        </a>
      </div>
      <nav
        class="flex-1 pt-2 px-2 overflow-y-auto overflow-x-hidden"
        [attr.aria-label]="'shared.app-layout.navigation' | translate"
      >
        <ul class="list-none m-0 p-0 flex flex-column nav-menu">
          @for (item of navigationItems; track item.label) {
            <li>
              <a
                class="nav-item"
                [routerLink]="item.link"
                routerLinkActive="active"
                ariaCurrentWhenActive="page"
                [routerLinkActiveOptions]="
                  item.exact ? exactMatch : sectionMatch
                "
                [matTooltip]="collapsed() ? (item.label | translate) : ''"
                matTooltipPosition="right"
              >
                <mat-icon class="text-lg" aria-hidden="true">{{
                  item.icon
                }}</mat-icon>
                <span class="white-space-nowrap">{{
                  item.label | translate
                }}</span>
              </a>
            </li>
          }
        </ul>
      </nav>
      <div [class]="collapsed() ? 'p-2' : 'p-3 flex flex-column gap-3'">
        @if (!collapsed()) {
          <app-language-switcher />
        }
        <div
          class="flex align-items-center gap-2 border-round-lg"
          [class]="collapsed() ? 'justify-content-center' : 'p-2 surface-100'"
        >
          <span class="avatar bg-primary font-medium" aria-hidden="true">{{
            currentOperator.initials
          }}</span>
          @if (!collapsed()) {
            <div class="flex flex-column min-w-0">
              <span class="text-sm font-medium white-space-nowrap">{{
                currentOperator.name
              }}</span>
              <span class="text-sm text-color-secondary white-space-nowrap">{{
                'shared.app-layout.operator-role' | translate
              }}</span>
            </div>
          }
        </div>
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="overflow-y-auto">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
